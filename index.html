<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#1f2937">
<title>Gate scanner</title>
<!--
  VESP Alumni Meet – live gate scanner.
  Host this one file anywhere with https (GitHub Pages, Netlify). It contains no data and no secrets:
  each volunteer opens it through their personal link (…#api=…&k=…) which the admin sends from the web app.
-->
<style>
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:#f3f4f6;color:#111827;font-size:15px}
.top{background:#1f2937;color:#fff;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:5}
.top b{font-size:16px}.top small{opacity:.7;font-size:12px}
.count{text-align:right}.count .n{font-size:22px;font-weight:700;line-height:1}.count .l{font-size:11px;opacity:.7}
.wrap{max-width:560px;margin:0 auto;padding:14px}
.hide{display:none!important}
.cam{position:relative;background:#000;border-radius:18px;overflow:hidden;aspect-ratio:4/3}
.cam video{width:100%;height:100%;object-fit:cover;display:block}
.frame{position:absolute;inset:12% 20%;border:3px solid rgba(255,255,255,.9);border-radius:14px;box-shadow:0 0 0 999px rgba(0,0,0,.25)}
.camlbl{position:absolute;left:0;right:0;bottom:10px;text-align:center;color:#fff;font-size:13px;text-shadow:0 1px 2px #000}
.camx{position:absolute;top:10px;right:10px;border:0;padding:8px 12px;font-size:14px;background:rgba(0,0,0,.55);color:#fff;border-radius:10px}
.card{margin-top:12px;border-radius:18px;padding:20px;text-align:center;color:#fff;background:#6b7280}
.card.green{background:#1e8e3e}.card.amber{background:#e37400}.card.red{background:#d93025}
.card .t{font-size:30px;font-weight:800}.card .nm{font-size:20px;font-weight:600;margin-top:6px;word-break:break-word}
.card .sb{font-size:15px;margin-top:4px}.card .nt{font-size:13px;opacity:.9;margin-top:8px}
.card .tg{display:inline-block;margin-top:10px;background:#fff;color:#7c2d12;font-weight:800;font-size:15px;padding:6px 12px;border-radius:10px}
button{border:0;border-radius:12px;padding:14px 10px;font-size:16px;font-weight:600;background:#fff;color:#111827;box-shadow:0 1px 2px rgba(0,0,0,.12);cursor:pointer;font-family:inherit}
.big{display:block;width:100%;margin-top:12px;background:#2563eb;color:#fff;font-size:20px;padding:20px;border-radius:16px}
.row{display:flex;gap:8px;margin-top:12px}.row button{flex:1}
input{flex:2;border:1px solid #d1d5db;border-radius:12px;padding:13px;font-size:18px;min-width:0;text-transform:uppercase;font-family:inherit}
.msg{white-space:pre-wrap;background:#fef2f2;color:#991b1b;border-radius:12px;padding:12px;font-size:14px;margin-top:12px}
.hd3{display:flex;justify-content:space-between;align-items:center;margin-top:18px}
.hd3 h3{font-size:12px;color:#6b7280;margin:0 4px;font-weight:700;text-transform:uppercase;letter-spacing:.05em}
.hd3 button{padding:6px 10px;font-size:13px;background:none;box-shadow:none;color:#2563eb}
.sum{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}.sum span{background:#e0e7ff;color:#3730a3;font-size:12px;font-weight:600;padding:5px 9px;border-radius:10px}
.scan{background:#fff;border-radius:12px;padding:10px 12px;margin-bottom:6px;display:flex;gap:10px;align-items:flex-start}
.dot{width:10px;height:10px;border-radius:50%;flex:none;margin-top:5px}.d-green{background:#1e8e3e}.d-amber{background:#e37400}.d-red{background:#d93025}
.scan .bd{flex:1;min-width:0}.l1{display:flex;justify-content:space-between;gap:8px;font-size:14px;font-weight:600}
.l1 span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.l1 .tm{font-weight:400;color:#6b7280;font-size:12px;white-space:nowrap}
.l2{font-size:12px;color:#6b7280;margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.muted{color:#6b7280;font-size:13px;text-align:center;padding:16px}
.gate{padding:48px 24px;text-align:center;color:#374151}.gate b{font-size:22px;display:block;margin-bottom:8px}
</style>
</head>
<body>
<div class="top"><div><b>Gate scanner</b><br><small id="who">Connecting…</small></div>
  <div class="count"><div class="n" id="cnt">–</div><div class="l">entered / passes</div></div></div>

<div class="gate hide" id="nolink"><b>Open your personal scanner link</b>
  This page only works through the link the admin sent you on WhatsApp.</div>

<div class="wrap" id="app">
  <div class="cam hide" id="camBox"><video id="v" playsinline muted autoplay></video><div class="frame"></div>
    <button class="camx" id="camStop" type="button">Stop</button><div class="camlbl">Hold the QR inside the box</div></div>
  <div class="card" id="card"><div class="t" id="ct">Ready</div><div class="nm" id="cn">Tap Start scanner</div><div class="sb" id="cs"></div><div class="tg hide" id="ctag"></div><div class="nt" id="cx"></div></div>
  <button class="big" id="startBtn" type="button">Start scanner</button>
  <div class="msg hide" id="err"></div>
  <form class="row" id="mf"><input id="code" placeholder="Type pass code" autocomplete="off"><button type="submit">Check</button></form>
  <div class="hd3"><h3 id="scanTitle">My scans</h3><button id="scanRef" type="button">Refresh</button></div>
  <div class="sum" id="sum"></div><div id="scans"><div class="muted">Loading…</div></div>
</div>
<canvas id="c" style="display:none"></canvas>

<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
<script>
(function(){
function $(i){return document.getElementById(i)}
function el(t,c,x){var e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e}

/* personal link: …#api=<web app url>&k=<key>. Kept on this phone so the bare page works next time. */
var P={};location.hash.replace(/^#/,"").split("&").forEach(function(kv){var i=kv.indexOf("=");if(i>0)P[kv.slice(0,i)]=decodeURIComponent(kv.slice(i+1))});
var API=P.api,KEY=P.k;
try{if(API&&KEY){localStorage.setItem("vespApi",API);localStorage.setItem("vespKey",KEY);history.replaceState(null,"",location.pathname)}
  else{API=localStorage.getItem("vespApi");KEY=localStorage.getItem("vespKey")}}catch(e){}
if(!API||!KEY||!/^https:\/\/script\.google(usercontent)?\.com\//.test(API)){$("app").classList.add("hide");$("nolink").classList.remove("hide");$("who").textContent="";return}

function call(params){
  var q=Object.keys(params).map(function(k){return k+"="+encodeURIComponent(params[k])}).join("&");
  return fetch(API+"?k="+encodeURIComponent(KEY)+"&"+q,{method:"GET",redirect:"follow",cache:"no-store"})
    .then(function(r){if(!r.ok)throw new Error("Server error "+r.status);return r.json()})
    .then(function(d){if(d&&d.error)throw new Error(d.error);return d});
}
function err(t){$("err").textContent=t||"";$("err").classList.toggle("hide",!t)}

/* result card */
var busy=false,inflight=false,last="",lastAt=0,ac=null;
function beep(ok){try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();var o=ac.createOscillator(),g=ac.createGain();o.frequency.value=ok?880:220;o.connect(g);g.connect(ac.destination);g.gain.value=.15;o.start();o.stop(ac.currentTime+(ok?.15:.45))}catch(e){}}
function card(tone,t,n,s,x,tag){$("card").className="card "+(tone||"");$("ct").textContent=t||"";$("cn").textContent=n||"";$("cs").textContent=s||"";$("cx").textContent=x||"";$("ctag").textContent=tag||"";$("ctag").classList.toggle("hide",!tag)}
function ready(){busy=false;card("","Ready",stream?"Point at the next pass":"Tap Start scanner","","")}
function show(r){card(r.tone,r.title,r.name,r.sub,r.note,r.tag);beep(r.tone==="green");if(navigator.vibrate)navigator.vibrate(r.tone==="green"?120:[200,100,200]);
  if(r.stats)$("cnt").textContent=r.stats.entered+" / "+r.stats.issued;loadScans();setTimeout(ready,r.tone==="green"?2200:3500)}
function check(raw){raw=String(raw||"").trim();if(!raw||busy)return;var now=Date.now();if(raw===last&&now-lastAt<15000)return;last=raw;lastAt=now;busy=true;inflight=true;card("","Checking…","","","");
  call({action:"check",code:raw}).then(function(r){inflight=false;show(r)}).catch(function(e){inflight=false;card("red","Error",String(e.message||e),"Check the internet and try again","");setTimeout(ready,3500)})}

/* live camera: native BarcodeDetector where available (fast on Android), jsQR otherwise */
var v=$("v"),cv=$("c"),cx=cv.getContext("2d",{willReadFrequently:true}),stream=null,detector=null,detecting=false;
try{if("BarcodeDetector" in window)BarcodeDetector.getSupportedFormats().then(function(f){if(f.indexOf("qr_code")>=0)detector=new BarcodeDetector({formats:["qr_code"]})}).catch(function(){})}catch(e){}
function stopCam(){if(stream)stream.getTracks().forEach(function(t){t.stop()});stream=null;v.srcObject=null;$("camBox").classList.add("hide");$("startBtn").classList.remove("hide");if(!busy)ready()}
function startCam(simple){err("");
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){err("This browser cannot use the camera. Open the link in Chrome (Android) or Safari (iPhone).");return}
  $("startBtn").textContent="Starting camera…";
  navigator.mediaDevices.getUserMedia({audio:false,video:simple?true:{facingMode:{ideal:"environment"},width:{ideal:1280},height:{ideal:720}}})
  .then(function(s){stream=s;v.srcObject=s;var p=v.play();if(p&&p.catch)p.catch(function(){});$("camBox").classList.remove("hide");$("startBtn").classList.add("hide");$("startBtn").textContent="Start scanner";
    try{localStorage.setItem("vespCam","1")}catch(e){}if(!busy)ready();tick()})
  .catch(function(e){if(!simple&&(e.name==="OverconstrainedError"||e.name==="NotFoundError"))return startCam(true);
    $("startBtn").textContent="Start scanner";try{localStorage.removeItem("vespCam")}catch(x){}
    var n=e&&e.name||"";
    if(n==="NotAllowedError")err("Camera permission is off for this page. In Chrome tap the icon left of the address → Permissions → Camera → Allow, then reload. ["+n+"]");
    else if(n==="NotReadableError")err("The camera is in use by another app. Close it and tap Start scanner again. ["+n+"]");
    else err("Could not start the camera. ["+(n||"error")+(e&&e.message?": "+e.message:"")+"]")})}
function tick(){if(!stream)return;
  if(!busy&&!detecting&&v.readyState>=2&&v.videoWidth){
    if(detector){detecting=true;detector.detect(v).then(function(r){detecting=false;if(r&&r.length&&r[0].rawValue)check(r[0].rawValue)}).catch(function(){detecting=false;detector=null})}
    else if(typeof jsQR==="function"){try{var w=640,h=Math.round(v.videoHeight*w/v.videoWidth);cv.width=w;cv.height=h;cx.drawImage(v,0,0,w,h);var q=jsQR(cx.getImageData(0,0,w,h).data,w,h,{inversionAttempts:"dontInvert"});if(q&&q.data)check(q.data)}catch(e){}}
    else err("The scanner could not load (no internet?). Reload, or type the pass code.")}
  setTimeout(tick,180)}
$("startBtn").onclick=function(){startCam(false)};
$("camStop").onclick=stopCam;
document.addEventListener("visibilitychange",function(){if(document.hidden)stopCam();else{try{if(localStorage.getItem("vespCam")==="1")startCam(false)}catch(e){}}});
$("mf").onsubmit=function(e){e.preventDefault();var c=$("code").value;if(inflight||!c.trim())return;$("code").value="";last="";busy=false;check(c)};

/* scans list: own scans, or everyone's for the admin */
function loadScans(){call({action:"scans"}).then(function(d){
  $("who").textContent=d.user||"";if(d.stats)$("cnt").textContent=d.stats.entered+" / "+d.stats.issued;
  var L=$("scans"),S=$("sum");L.innerHTML="";S.innerHTML="";$("scanTitle").textContent=d.admin?"All scans":"My scans";
  if(d.admin)Object.keys(d.byVol).sort(function(a,b){return d.byVol[b]-d.byVol[a]}).forEach(function(k){S.appendChild(el("span",null,k.split("@")[0]+": "+d.byVol[k]+" in"))});
  else S.appendChild(el("span",null,"You let in "+d.mine));
  if(!d.list.length){L.appendChild(el("div","muted","No scans yet."));return}
  d.list.forEach(function(x){var r=el("div","scan");r.appendChild(el("span","dot d-"+x.tone));var b=el("div","bd"),l1=el("div","l1");
    l1.appendChild(el("span",null,x.result+(x.name?" · "+x.name:"")));l1.appendChild(el("span","tm",x.time));b.appendChild(l1);
    var l2=[x.sub,d.admin?("by "+x.vol.split("@")[0]):""].filter(Boolean).join(" · ");if(l2)b.appendChild(el("div","l2",l2));r.appendChild(b);L.appendChild(r)});
}).catch(function(e){$("who").textContent="Not connected";$("scans").innerHTML="";err(String(e.message||e))})}
$("scanRef").onclick=loadScans;

loadScans();
try{if(localStorage.getItem("vespCam")==="1")startCam(false)}catch(e){}
})();
</script>
</body>
</html>
