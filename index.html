<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#1f2937">
<title>Gate scanner</title>
<!--
  VESP Alumni Meet – live gate scanner.
  Host this one file anywhere with https (GitHub Pages, Netlify). It contains no data and no secrets:
  each volunteer opens it through their personal link (…#api=…&k=…) which the admin sends from the web app.
-->
<style>
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:#f3f4f6;color:#111827;font-size:15px}
.top{background:#1f2937;color:#fff;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:5}
.top b{font-size:16px}.top small{opacity:.7;font-size:12px}
.count{text-align:right}.count .n{font-size:22px;font-weight:700;line-height:1}.count .l{font-size:11px;opacity:.7}
.wrap{max-width:560px;margin:0 auto;padding:14px}
.hide{display:none!important}
.cam{position:relative;background:#000;border-radius:18px;overflow:hidden;aspect-ratio:4/3}
.cam video{width:100%;height:100%;object-fit:cover;display:block}
.frame{position:absolute;inset:12% 20%;border:3px solid rgba(255,255,255,.9);border-radius:14px;box-shadow:0 0 0 999px rgba(0,0,0,.25)}
.camlbl{position:absolute;left:0;right:0;bottom:10px;text-align:center;color:#fff;font-size:13px;text-shadow:0 1px 2px #000}
.camx{position:absolute;top:10px;right:10px;border:0;padding:8px 12px;font-size:14px;background:rgba(0,0,0,.55);color:#fff;border-radius:10px}
.card{margin-top:12px;border-radius:18px;padding:20px;text-align:center;color:#fff;background:#6b7280}
.card.green{background:#1e8e3e}.card.amber{background:#e37400}.card.red{background:#d93025}
.card .t{font-size:30px;font-weight:800}.card .nm{font-size:20px;font-weight:600;margin-top:6px;word-break:break-word}
.card .sb{font-size:15px;margin-top:4px}.card .nt{font-size:13px;opacity:.9;margin-top:8px}
.card .tg{display:inline-block;margin-top:10px;background:#fff;color:#7c2d12;font-weight:800;font-size:15px;padding:6px 12px;border-radius:10px}
button{border:0;border-radius:12px;padding:14px 10px;font-size:16px;font-weight:600;background:#fff;color:#111827;box-shadow:0 1px 2px rgba(0,0,0,.12);cursor:pointer;font-family:inherit}
.big{display:block;width:100%;margin-top:12px;background:#2563eb;color:#fff;font-size:20px;padding:20px;border-radius:16px}
.row{display:flex;gap:8px;margin-top:12px}.row button{flex:1}
input{flex:2;border:1px solid #d1d5db;border-radius:12px;padding:13px;font-size:18px;min-width:0;text-transform:uppercase;font-family:inherit}
.msg{white-space:pre-wrap;background:#fef2f2;color:#991b1b;border-radius:12px;padding:12px;font-size:14px;margin-top:12px}
.hd3{display:flex;justify-content:space-between;align-items:center;margin-top:18px}
.hd3 h3{font-size:12px;color:#6b7280;margin:0 4px;font-weight:700;text-transform:uppercase;letter-spacing:.05em}
.hd3 button{padding:6px 10px;font-size:13px;background:none;box-shadow:none;color:#2563eb}
.sum{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}.sum span{background:#e0e7ff;color:#3730a3;font-size:12px;font-weight:600;padding:5px 9px;border-radius:10px}
.scan{background:#fff;border-radius:12px;padding:10px 12px;margin-bottom:6px;display:flex;gap:10px;align-items:flex-start}
.dot{width:10px;height:10px;border-radius:50%;flex:none;margin-top:5px}.d-green{background:#1e8e3e}.d-amber{background:#e37400}.d-red{background:#d93025}
.scan .bd{flex:1;min-width:0}.l1{display:flex;justify-content:space-between;gap:8px;font-size:14px;font-weight:600}
.l1 span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.l1 .tm{font-weight:400;color:#6b7280;font-size:12px;white-space:nowrap}
.l2{font-size:12px;color:#6b7280;margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.muted{color:#6b7280;font-size:13px;text-align:center;padding:16px}
.spotBtn{display:block;width:100%;margin-top:12px;background:#fff;color:#1d4ed8;border:2px dashed #93c5fd;box-shadow:none;font-size:16px;padding:14px;border-radius:12px;font-weight:700}
.spot{background:#fff;border-radius:16px;padding:14px;margin-top:12px}
.spotHd{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px}.spotHd b{font-size:17px}
.spotHd button{flex:none;width:auto;padding:6px 12px;font-size:14px;box-shadow:none;background:#f3f4f6;color:#111827}
.spot label{display:block;font-size:13px;font-weight:600;color:#374151;margin-top:10px}.spot label small{font-weight:400;color:#6b7280}
.spot input,.spot select{display:block;width:100%;margin-top:4px;border:1px solid #d1d5db;border-radius:10px;padding:12px;font-size:16px;text-transform:none;background:#fff;font-family:inherit;color:#111827}
.spot details{margin-top:12px;font-size:14px;color:#374151}.spot summary{cursor:pointer;font-weight:600}
.spot .big{margin-top:16px}
.spotCard{border-radius:14px;padding:16px;color:#fff;text-align:center;background:#6b7280}.spotCard.green{background:#1e8e3e}.spotCard.amber{background:#e37400}.spotCard.red{background:#d93025}
.spotCard .t{font-size:22px;font-weight:800}.spotCard .nm{font-size:17px;font-weight:600;margin-top:4px;word-break:break-word}.spotCard .m{font-size:14px;margin-top:8px;line-height:1.45}
.sugg{border:1px solid #d1d5db;border-radius:10px;margin-top:4px;overflow:hidden}
.sugg button{display:block;width:100%;text-align:left;border:0;border-bottom:1px solid #f3f4f6;border-radius:0;box-shadow:none;background:#fff;padding:10px 12px;font-size:15px;font-weight:600;color:#111827}
.sugg button small{display:block;font-weight:400;color:#6b7280;font-size:12px;margin-top:2px}.sugg .none{padding:10px 12px;font-size:13px;color:#6b7280}
.matched{display:flex;align-items:center;gap:8px;margin-top:8px;background:#ecfdf5;color:#065f46;border-radius:10px;padding:8px 10px;font-size:13px;font-weight:600}
.matched span{flex:1}.matched button{flex:none;width:auto;padding:6px 10px;font-size:13px;box-shadow:none;background:#fff;color:#065f46}
.spot label.chk{display:flex;align-items:center;justify-content:flex-start;gap:8px;font-weight:500;margin-top:8px;text-align:left}.spot label.chk input{display:inline-block;flex:none;width:18px;height:18px;margin:0;padding:0}
.spot .row{flex-wrap:wrap}.spot .row button{flex:1 1 40%;font-size:15px}.spot .pri{background:#2563eb;color:#fff}
.gate{padding:48px 24px;text-align:center;color:#374151}.gate b{font-size:22px;display:block;margin-bottom:8px}
</style>
</head>
<body>
<div class="top"><div><b>Gate scanner</b><br><small id="who">Connecting…</small></div>
  <div class="count"><div class="n" id="cnt">–</div><div class="l">entered / passes</div></div></div>

<div class="gate hide" id="nolink"><b>Sign in to start the scanner</b>
  <span id="nolinkMsg">Open the Alumni Meet web app, sign in with your ves.ac.in account, and tap <b style="display:inline;font-size:inherit">Open live scanner</b> on the Gate tab.</span>
  <div id="appBtn"></div></div>

<div class="wrap" id="app">
  <div class="cam hide" id="camBox"><video id="v" playsinline muted autoplay></video><div class="frame"></div>
    <button class="camx" id="camStop" type="button">Stop</button><div class="camlbl">Hold the QR inside the box</div></div>
  <div class="card" id="card"><div class="t" id="ct">Ready</div><div class="nm" id="cn">Tap Start scanner</div><div class="sb" id="cs"></div><div class="tg hide" id="ctag"></div><div class="nt" id="cx"></div></div>
  <button class="big" id="startBtn" type="button">Start scanner</button>
  <div class="msg hide" id="err"></div>
  <form class="row" id="mf"><input id="code" placeholder="Type pass code" autocomplete="off"><button type="submit">Check</button></form>
  <button type="button" class="spotBtn" id="spotBtn">＋ Spot registration</button>
  <div class="spot hide" id="spotBox">
    <div class="spotHd"><b>Spot registration</b><button type="button" id="spotX">Close</button></div>
    <form id="spotF" autocomplete="off">
      <label>Full name <small>(type 3+ letters to find them in our records)</small><input id="sp_name" required autocomplete="off" spellcheck="false"></label>
      <div class="sugg hide" id="sp_sugg"></div>
      <div class="matched hide" id="sp_match"><span id="sp_matchTxt"></span><button type="button" id="sp_unmatch">Clear</button></div>
      <label>Earlier name, if changed <small>(optional)</small><input id="sp_old"></label>
      <label>Branch<select id="sp_branch" required><option value="">Loading…</option></select></label>
      <label>Year of passing<select id="sp_year" required><option value="">Loading…</option></select></label>
      <label id="sp_enrL" class="hide">MSBTE enrollment no. <small>(optional, confirms instantly)</small><input id="sp_enr" inputmode="numeric"></label>
      <div class="hide" id="sp_recEmailBox">
        <label class="chk"><input type="radio" name="sp_em" id="sp_emRec" checked> Send pass to email on record <b id="sp_emMask"></b></label>
        <label class="chk"><input type="radio" name="sp_em" id="sp_emNew"> Use a different email</label>
      </div>
      <label id="sp_emailL">Email <small>(the QR pass is sent here)</small><input id="sp_email" type="email"></label>
      <div class="hide" id="sp_recPhoneBox">
        <label class="chk"><input type="radio" name="sp_ph" id="sp_phRec" checked> Mobile on record <b id="sp_phMask"></b></label>
        <label class="chk"><input type="radio" name="sp_ph" id="sp_phNew"> Use a different mobile</label>
      </div>
      <label id="sp_phoneL">Mobile<input id="sp_phone" type="tel" inputmode="numeric"></label>
      <details><summary>More details (optional)</summary>
        <label>Organisation / College<input id="sp_org"></label>
        <label>Designation<input id="sp_desig"></label></details>
      <button type="submit" class="big" id="sp_go">Register &amp; email pass</button>
    </form>
    <div id="spotRes" class="hide"></div>
  </div>
  <div class="hd3"><h3 id="scanTitle">My scans</h3><button id="scanRef" type="button">Refresh</button></div>
  <div class="sum" id="sum"></div><div id="scans"><div class="muted">Loading…</div></div>
</div>
<canvas id="c" style="display:none"></canvas>

<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
<script>
(function(){
function $(i){return document.getElementById(i)}
function el(t,c,x){var e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e}

/* personal link: …#api=<web app url>&k=<key>. Kept on this phone so the bare page works next time. */
var P={};location.hash.replace(/^#/,"").split("&").forEach(function(kv){var i=kv.indexOf("=");if(i>0)P[kv.slice(0,i)]=decodeURIComponent(kv.slice(i+1))});
var API=P.api,ACT=P.a,APP=P.app,KEY="",DEV="";
/* a random ID for this phone: the scanner session only works on the phone it was activated on */
try{DEV=localStorage.getItem("vespDev")||"";if(!/^[a-z0-9]{32}$/.test(DEV)){var a=new Uint8Array(16);crypto.getRandomValues(a);DEV=Array.prototype.map.call(a,function(x){return("0"+x.toString(16)).slice(-2)}).join("");localStorage.setItem("vespDev",DEV)}}catch(e){}
try{if(API)localStorage.setItem("vespApi",API);else API=localStorage.getItem("vespApi");
  if(APP)localStorage.setItem("vespApp",APP);else APP=localStorage.getItem("vespApp");
  KEY=localStorage.getItem("vespKey")||"";if(location.hash)history.replaceState(null,"",location.pathname)}catch(e){}
function signInScreen(msg){try{stopCam()}catch(e){}$("app").classList.add("hide");$("nolink").classList.remove("hide");$("who").textContent="";$("cnt").textContent="–";
  if(msg)$("nolinkMsg").textContent=msg;var B=$("appBtn");B.innerHTML="";
  if(APP&&/^https:\/\/script\.google\.com\//.test(APP)){var a=el("a","big","Open the web app and sign in");a.href=APP;a.style.cssText="text-decoration:none;margin-top:18px";B.appendChild(a)}}
if(!API||!/^https:\/\/script\.google(usercontent)?\.com\//.test(API)||(!KEY&&!ACT)){signInScreen("");return}

function call(params){
  var q=Object.keys(params).map(function(k){return k+"="+encodeURIComponent(params[k])}).join("&");
  return fetch(API+"?k="+encodeURIComponent(KEY)+"&d="+DEV+"&"+q,{method:"GET",redirect:"follow",cache:"no-store"})
    .then(function(r){if(!r.ok)throw new Error("Server error "+r.status);return r.json()})
    .then(function(d){if(d&&d.error){if(d.blocked)lockOut(d.error);throw new Error(d.error)}return d});
}
/* link refused (forwarded copy, removed volunteer, new link issued): stop everything */
function lockOut(msg){try{localStorage.removeItem("vespKey")}catch(e){}KEY="";signInScreen(msg)}
function err(t){$("err").textContent=t||"";$("err").classList.toggle("hide",!t)}

/* result card */
var busy=false,inflight=false,last="",lastAt=0,ac=null;
function beep(ok){try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();var o=ac.createOscillator(),g=ac.createGain();o.frequency.value=ok?880:220;o.connect(g);g.connect(ac.destination);g.gain.value=.15;o.start();o.stop(ac.currentTime+(ok?.15:.45))}catch(e){}}
function card(tone,t,n,s,x,tag){$("card").className="card "+(tone||"");$("ct").textContent=t||"";$("cn").textContent=n||"";$("cs").textContent=s||"";$("cx").textContent=x||"";$("ctag").textContent=tag||"";$("ctag").classList.toggle("hide",!tag)}
function ready(){busy=false;card("","Ready",stream?"Point at the next pass":"Tap Start scanner","","")}
function show(r){card(r.tone,r.title,r.name,r.sub,r.note,r.tag);beep(r.tone==="green");if(navigator.vibrate)navigator.vibrate(r.tone==="green"?120:[200,100,200]);
  if(r.stats)$("cnt").textContent=r.stats.entered+" / "+r.stats.issued;loadScans();setTimeout(ready,r.tone==="green"?2200:3500)}
function check(raw){raw=String(raw||"").trim();if(!raw||busy)return;var now=Date.now();if(raw===last&&now-lastAt<15000)return;last=raw;lastAt=now;busy=true;inflight=true;card("","Checking…","","","");
  call({action:"check",code:raw}).then(function(r){inflight=false;show(r)}).catch(function(e){inflight=false;card("red","Error",String(e.message||e),"Check the internet and try again","");setTimeout(ready,3500)})}

/* live camera: native BarcodeDetector where available (fast on Android), jsQR otherwise */
var v=$("v"),cv=$("c"),cx=cv.getContext("2d",{willReadFrequently:true}),stream=null,detector=null,detecting=false;
try{if("BarcodeDetector" in window)BarcodeDetector.getSupportedFormats().then(function(f){if(f.indexOf("qr_code")>=0)detector=new BarcodeDetector({formats:["qr_code"]})}).catch(function(){})}catch(e){}
function stopCam(){if(stream)stream.getTracks().forEach(function(t){t.stop()});stream=null;v.srcObject=null;$("camBox").classList.add("hide");$("startBtn").classList.remove("hide");if(!busy)ready()}
function startCam(simple){err("");
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){err("This browser cannot use the camera. Open the link in Chrome (Android) or Safari (iPhone).");return}
  $("startBtn").textContent="Starting camera…";
  navigator.mediaDevices.getUserMedia({audio:false,video:simple?true:{facingMode:{ideal:"environment"},width:{ideal:1280},height:{ideal:720}}})
  .then(function(s){stream=s;v.srcObject=s;var p=v.play();if(p&&p.catch)p.catch(function(){});$("camBox").classList.remove("hide");$("startBtn").classList.add("hide");$("startBtn").textContent="Start scanner";
    try{localStorage.setItem("vespCam","1")}catch(e){}if(!busy)ready();tick()})
  .catch(function(e){if(!simple&&(e.name==="OverconstrainedError"||e.name==="NotFoundError"))return startCam(true);
    $("startBtn").textContent="Start scanner";try{localStorage.removeItem("vespCam")}catch(x){}
    var n=e&&e.name||"";
    if(n==="NotAllowedError")err("Camera permission is off for this page. In Chrome tap the icon left of the address → Permissions → Camera → Allow, then reload. ["+n+"]");
    else if(n==="NotReadableError")err("The camera is in use by another app. Close it and tap Start scanner again. ["+n+"]");
    else err("Could not start the camera. ["+(n||"error")+(e&&e.message?": "+e.message:"")+"]")})}
function tick(){if(!stream)return;
  if(!busy&&!detecting&&v.readyState>=2&&v.videoWidth){
    if(detector){detecting=true;detector.detect(v).then(function(r){detecting=false;if(r&&r.length&&r[0].rawValue)check(r[0].rawValue)}).catch(function(){detecting=false;detector=null})}
    else if(typeof jsQR==="function"){try{var w=640,h=Math.round(v.videoHeight*w/v.videoWidth);cv.width=w;cv.height=h;cx.drawImage(v,0,0,w,h);var q=jsQR(cx.getImageData(0,0,w,h).data,w,h,{inversionAttempts:"dontInvert"});if(q&&q.data)check(q.data)}catch(e){}}
    else err("The scanner could not load (no internet?). Reload, or type the pass code.")}
  setTimeout(tick,180)}
$("startBtn").onclick=function(){startCam(false)};
$("camStop").onclick=stopCam;
document.addEventListener("visibilitychange",function(){if(document.hidden)stopCam();else{try{if(localStorage.getItem("vespCam")==="1")startCam(false)}catch(e){}}});
$("mf").onsubmit=function(e){e.preventDefault();var c=$("code").value;if(inflight||!c.trim())return;$("code").value="";last="";busy=false;check(c)};

/* scans list: own scans, or everyone's for the admin */
function loadScans(){call({action:"scans"}).then(function(d){
  $("who").textContent=d.user||"";if(d.stats)$("cnt").textContent=d.stats.entered+" / "+d.stats.issued;
  var L=$("scans"),S=$("sum");L.innerHTML="";S.innerHTML="";$("scanTitle").textContent=d.admin?"All scans":"My scans";
  if(d.admin)Object.keys(d.byVol).sort(function(a,b){return d.byVol[b]-d.byVol[a]}).forEach(function(k){S.appendChild(el("span",null,k.split("@")[0]+": "+d.byVol[k]+" in"))});
  else S.appendChild(el("span",null,"You let in "+d.mine));
  if(!d.list.length){L.appendChild(el("div","muted","No scans yet."));return}
  d.list.forEach(function(x){var r=el("div","scan");r.appendChild(el("span","dot d-"+x.tone));var b=el("div","bd"),l1=el("div","l1");
    l1.appendChild(el("span",null,x.result+(x.name?" · "+x.name:"")));l1.appendChild(el("span","tm",x.time));b.appendChild(l1);
    var l2=[x.sub,d.admin?("by "+x.vol.split("@")[0]):""].filter(Boolean).join(" · ");if(l2)b.appendChild(el("div","l2",l2));r.appendChild(b);L.appendChild(r)});
}).catch(function(e){$("who").textContent="Not connected";$("scans").innerHTML="";err(String(e.message||e))})}
$("scanRef").onclick=loadScans;

function post(body){body.k=KEY;body.d=DEV;
  return fetch(API,{method:"POST",redirect:"follow",cache:"no-store",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(body)})
    .then(function(r){if(!r.ok)throw new Error("Server error "+r.status);return r.json()})
    .then(function(d){if(d&&d.error){if(d.blocked)lockOut(d.error);throw new Error(d.error)}return d})}
var SPOT_API={spec:function(ok,bad){call({action:"spotspec"}).then(ok).catch(bad)},
  submit:function(d,ok,bad){post({action:"spot",data:d}).then(function(r){loadScans();ok(r)}).catch(bad)},
  resend:function(e,ok,bad){call({action:"resend",email:e}).then(ok).catch(bad)},index:function(ok,bad){call({action:"index"}).then(ok).catch(bad)},recinfo:function(r,ok,bad){call({action:"recinfo",row:r}).then(ok).catch(bad)},
  onOpen:function(){stopCam()},onClose:function(){try{if(localStorage.getItem("vespCam")==="1")startCam(false)}catch(e){}}};
/* ---------- spot registration (filled by the volunteer on someone's behalf) ---------- */
(function(){
var spec=null,busyS=false,pick=null;
function g(i){return document.getElementById(i)}
function opts(sel,vals,ph){sel.innerHTML="";var o=document.createElement("option");o.value="";o.textContent=ph;sel.appendChild(o);
  vals.forEach(function(v){var x=document.createElement("option");x.value=v;x.textContent=v;sel.appendChild(x)})}
function fill(){opts(g("sp_branch"),spec.branches,"Select branch");opts(g("sp_year"),spec.years.slice().reverse(),"Select year")}
function enrVis(){var y=parseInt(g("sp_year").value,10),rec=pick&&pick.he&&g("sp_emRec").checked;g("sp_enrL").classList.toggle("hide",!(spec&&y>=spec.enrollFrom)||!!rec)}
g("sp_year").onchange=enrVis;
/* names are searched on the phone itself: instant, no waiting for the server */
var IDX=null,IDXL=false,BRM={},LBM={},TT={MR:1,MRS:1,MS:1,MISS:1,DR:1,ER:1,PROF:1,SHRI:1,SRI:1,SMT:1,KUM:1,KU:1};
function toks(n){return String(n||"").toUpperCase().replace(/[^A-Z\s]/g," ").split(/\s+/).filter(function(t){return t&&!TT[t]})}
function skel(t){var s=t.toLowerCase();s=s.replace(/ee/g,"i").replace(/oo/g,"u").replace(/aa/g,"a").replace(/ph/g,"f").replace(/(.)\1+/g,"$1");
  s=s.replace(/([bcdgkpt])h/g,"$1").replace(/sh/g,"s").replace(/w/g,"v").replace(/y$/,"i");return s.replace(/(.)\1+/g,"$1")}
function loadIdx(then){if(IDX){if(then)then();return}if(IDXL)return;IDXL=true;
  SPOT_API.index(function(d){IDXL=false;BRM=d.branches||{};LBM=d.labels||{};
    IDX=(d.list||[]).map(function(r){var t=toks(r[1]);return{row:r[0],name:r[1],code:r[2],year:r[3]?String(r[3]):"",admitted:r[4]||"",he:r[5],hp:r[6],t:t,s:t.map(skel)}});
    if(then)then();else if(g("sp_name").value&&!pick)g("sp_name").oninput()},function(){IDXL=false})}
function search(q){var qt=toks(q).filter(function(t){return t.length>=2});if(!qt.length)return[];var qs=qt.map(skel),hits=[];
  for(var n=0;n<IDX.length;n++){var r=IDX[n],sc=0,ok=true;
    for(var i=0;i<qt.length&&ok;i++){var b=0;for(var j=0;j<r.t.length;j++){if(r.t[j]===qt[i])b=Math.max(b,3);else if(r.t[j].indexOf(qt[i])===0)b=Math.max(b,2);else if(qs[i].length>=3&&r.s[j].indexOf(qs[i])===0)b=Math.max(b,1)}
      if(!b)ok=false;else sc+=b}
    if(ok)hits.push([sc,r])}
  hits.sort(function(a,b){return b[0]-a[0]||a[1].name.length-b[1].name.length});
  return hits.slice(0,8).map(function(h){var r=h[1];return{row:r.row,name:r.name,code:r.code,year:r.year,admitted:r.admitted,he:r.he,hp:r.hp,branch:BRM[r.code]||"",label:LBM[r.code]||r.code}})}
setTimeout(function(){try{loadIdx()}catch(e){}},4000);
/* email / mobile: "on record" (masked, filled on the server) or typed */
function contactUI(){var re=pick&&pick.he,rp=pick&&pick.hp;
  g("sp_recEmailBox").classList.toggle("hide",!re);g("sp_emailL").classList.toggle("hide",!!(re&&g("sp_emRec").checked));
  g("sp_recPhoneBox").classList.toggle("hide",!rp);g("sp_phoneL").classList.toggle("hide",!!(rp&&g("sp_phRec").checked));enrVis()}
["sp_emRec","sp_emNew","sp_phRec","sp_phNew"].forEach(function(i){g(i).onchange=contactUI});
function unmatch(){pick=null;g("sp_match").classList.add("hide");g("sp_emRec").checked=true;g("sp_phRec").checked=true;contactUI()}
g("sp_unmatch").onclick=function(){unmatch();g("sp_name").focus()};
function choose(s){pick=s;g("sp_name").value=s.name;g("sp_sugg").classList.add("hide");
  if(s.branch)g("sp_branch").value=s.branch;if(s.year&&spec&&spec.years.indexOf(s.year)>=0)g("sp_year").value=s.year;enrVis();
  g("sp_matchTxt").textContent="✓ Matched to record: "+s.name+" · "+s.code+" · "+(s.year||"");g("sp_match").classList.remove("hide");
  g("sp_emRec").checked=true;g("sp_phRec").checked=true;g("sp_emMask").textContent=s.he?"…":"";g("sp_phMask").textContent=s.hp?"…":"";contactUI();
  if(s.he||s.hp)SPOT_API.recinfo(s.row,function(m){if(pick!==s)return;g("sp_emMask").textContent=m.emailMask||"";g("sp_phMask").textContent=m.phoneMask||""},function(){})}
function suggest(list){var S=g("sp_sugg");S.innerHTML="";S.classList.remove("hide");
  if(!list.length){S.appendChild(el("div","none","No match in our records. Fill in the details by hand."));return}
  list.forEach(function(s){var b=el("button",null,s.name);b.type="button";b.appendChild(el("small",null,[s.label,s.year?"passed "+s.year:"",s.admitted?"joined "+s.admitted:""].filter(Boolean).join(" · ")));
    b.onclick=function(){choose(s)};S.appendChild(b)})}
g("sp_name").oninput=function(){var f=g("sp_name");if(pick&&f.value!==pick.name)unmatch();var q=f.value;
  if(q.replace(/[^A-Za-z]/g,"").length<3){g("sp_sugg").classList.add("hide");return}
  if(!IDX){var S=g("sp_sugg");S.innerHTML="";S.classList.remove("hide");S.appendChild(el("div","none","Loading alumni names… (first time only)"));loadIdx();return}
  if(!pick)suggest(search(q))};
function goBtn(on){var b=g("sp_go");b.disabled=!on;b.textContent=on?"Register & email pass":"Registering… (up to 20 seconds)"}
function resetForm(){g("spotF").reset();unmatch();g("sp_sugg").classList.add("hide");g("sp_enrL").classList.add("hide");g("spotF").classList.remove("hide");g("spotRes").classList.add("hide");goBtn(true)}
function openSpot(){if(SPOT_API.onOpen)SPOT_API.onOpen();g("spotBox").classList.remove("hide");g("spotBtn").classList.add("hide");resetForm();
  loadIdx();
  if(!spec)SPOT_API.spec(function(s){spec=s;fill()},function(e){showRes({tone:"red",title:"Could not load the form",msg:String(e&&e.message||e)})});
  setTimeout(function(){g("spotBox").scrollIntoView({behavior:"smooth",block:"start"})},50)}
function closeSpot(){g("spotBox").classList.add("hide");g("spotBtn").classList.remove("hide");if(SPOT_API.onClose)SPOT_API.onClose()}
function showRes(r){var R=g("spotRes");R.innerHTML="";R.classList.remove("hide");g("spotF").classList.add("hide");
  var c=el("div","spotCard "+(r.tone||""));c.appendChild(el("div","t",r.title||""));if(r.name)c.appendChild(el("div","nm",r.name));
  if(r.sub)c.appendChild(el("div","m",r.sub));if(r.msg)c.appendChild(el("div","m",r.msg));R.appendChild(c);
  var row=el("div","row");
  if(r.canResend&&r.email){var rs=el("button",null,"Resend pass");rs.type="button";rs.onclick=function(){rs.disabled=true;rs.textContent="Sending…";
    SPOT_API.resend(r.key||r.email,function(x){showRes({tone:x.tone,title:x.title,name:r.name,sub:r.sub,msg:x.msg,email:r.email,key:r.key,canResend:x.tone==="green"})},
      function(e){rs.disabled=false;rs.textContent="Resend pass";alert(String(e&&e.message||e))})};row.appendChild(rs)}
  if(r.title==="Check the details"||r.title==="Error"){var fx=el("button",null,"Fix details");fx.type="button";fx.onclick=function(){g("spotRes").classList.add("hide");g("spotF").classList.remove("hide");goBtn(true)};row.appendChild(fx)}
  var an=el("button",null,"Register another");an.type="button";an.onclick=resetForm;row.appendChild(an);
  var bk=el("button","pri","Back to scanner");bk.type="button";bk.onclick=closeSpot;row.appendChild(bk);R.appendChild(row)}
g("spotBtn").onclick=openSpot;g("spotX").onclick=closeSpot;
g("spotF").onsubmit=function(e){e.preventDefault();if(busyS)return;
  var useE=!!(pick&&pick.emailMask&&g("sp_emRec").checked),useP=!!(pick&&pick.phoneMask&&g("sp_phRec").checked);
  if(!useE&&!g("sp_email").value.trim()){alert("Enter an email: the QR pass is sent there.");g("sp_email").focus();return}
  if(!useP&&!g("sp_phone").value.trim()){alert("Enter a mobile number.");g("sp_phone").focus();return}
  busyS=true;goBtn(false);
  var d={name:g("sp_name").value,oldname:g("sp_old").value,branch:g("sp_branch").value,year:g("sp_year").value,enrollment:g("sp_enr").value,
    email:useE?"":g("sp_email").value,phone:useP?"":g("sp_phone").value,org:g("sp_org").value,desig:g("sp_desig").value,
    rec:pick?pick.row:"",useRecEmail:useE,useRecPhone:useP};
  SPOT_API.submit(d,function(r){busyS=false;showRes(r)},
    function(e){busyS=false;showRes({tone:"red",title:"Error",msg:String(e&&e.message||e)+". Check the internet; tap Fix details and try again."})})};
})();
function startApp(){loadScans();try{if(localStorage.getItem("vespCam")==="1")startCam(false)}catch(e){}}
if(ACT){
  /* one-time activation code from the signed-in web app: swap it for this phone's session */
  card("","Activating…","","","");
  fetch(API+"?action=activate&a="+encodeURIComponent(ACT)+"&d="+DEV,{method:"GET",redirect:"follow",cache:"no-store"})
    .then(function(r){if(!r.ok)throw new Error("Server error "+r.status);return r.json()})
    .then(function(d){if(d.error){lockOut(d.error);return}KEY=d.k;try{localStorage.setItem("vespKey",KEY)}catch(e){}ready();startApp()})
    .catch(function(e){err("Could not activate: "+(e.message||e)+". Check the internet and try again from the web app.")});
}else startApp();
})();
</script>
